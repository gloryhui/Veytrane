name: Windows full NAT and storage tests

on:
  # Final candidate branch is pushed once local validation is complete.
  # PR checks are sufficient; avoid duplicate push runs for the same head.
  pull_request:
  workflow_dispatch:

jobs:
  windows-all:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the standard Agent and management CLI
        run: cargo check --locked --no-default-features --features agent-standard --bin p2p-agent --bin p2p-node
      - name: Run all Rust tests on Windows
        run: cargo test --locked --no-default-features --features node --all-targets --no-fail-fast
      - name: Run native IPv6 regressions with capability diagnostics
        run: cargo test --locked --no-default-features --features node ipv6 --all-targets -- --nocapture
      - name: Run local authenticated Relay regressions
        run: cargo test --locked --no-default-features --features node relay_ --all-targets -- --nocapture
