[package]
name = "p2p_file"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Veytrane：跨网络的可信设备互联，身份认证与授权、QUIC 直连、服务访问与文件传输"
repository = "https://github.com/gloryhui/Veytrane"
readme = "README.md"
keywords = ["p2p", "nat-traversal", "quic", "file-transfer", "tunnel"]
categories = ["network-programming"]
license = "MIT"

[workspace]
members = [
    "apps/web-management",
    "crates/veytrane-file-policy",
    "crates/veytrane-files",
    "crates/veytrane-http-auth",
    "crates/veytrane-management",
    "crates/veytrane-node",
    "crates/veytrane-speed",
    "crates/veytrane-tcp",
    "crates/veytrane-transport",
]
default-members = ["."]
resolver = "3"

[features]
default = ["node"]
node-speed = ["dep:veytrane-speed", "veytrane-speed/node-runtime"]
node-runtime = [
    "dep:veytrane-file-policy",
    "dep:veytrane-node",
    "veytrane-node/remote-auth",
    "veytrane-tcp/node-runtime",
    "veytrane-transport/private-storage",
    "dep:sha2",
    "dep:windows-sys",
]
sub2api-client = ["sub2api-runtime"]
sub2api-gateway = ["sub2api-runtime"]
sub2api-runtime = ["node-runtime", "dep:dirs"]
live = ["node-runtime", "dep:axum", "dep:reqwest", "dep:dirs"]
node = ["agent-full", "standalone", "sub2api-runtime"]
agent-full = ["agent-base", "agent-files", "agent-web", "node-cli"]
agent-base = ["node-runtime", "node-speed", "dep:veytrane-management"]
agent-files = ["agent-base", "dep:veytrane-files", "veytrane-files/node-runtime"]
agent-web = ["agent-base", "dep:veytrane-web-management"]
node-cli = ["agent-base", "agent-web"]
standalone = [
    "dep:veytrane-files",
    "dep:veytrane-http-auth",
    "dep:veytrane-speed",
    "dep:veytrane-tcp",
    "dep:axum",
    "signaling-server",
]
signaling-server = ["dep:rusqlite", "veytrane-transport/signal-tls-server"]
gui = ["node", "desktop-client"]
desktop-client = [
    "dep:veytrane-file-policy",
    "dep:veytrane-management",
    "dep:veytrane-node",
    "dep:gpui",
    "dep:unicode-segmentation",
    "dep:raw-window-handle",
    "dep:tray-icon",
    "dep:ksni",
    "dep:x11rb",
    "dep:objc2",
    "dep:windows-sys",
]

[dependencies]
veytrane-file-policy = { path = "crates/veytrane-file-policy", optional = true }
veytrane-files = { path = "crates/veytrane-files", optional = true }
veytrane-http-auth = { path = "crates/veytrane-http-auth", optional = true }
veytrane-management = { path = "crates/veytrane-management", optional = true }
veytrane-node = { path = "crates/veytrane-node", optional = true }
veytrane-speed = { path = "crates/veytrane-speed", default-features = false, optional = true }
veytrane-tcp = { path = "crates/veytrane-tcp", optional = true }
veytrane-transport = { path = "crates/veytrane-transport", features = ["signal-tls"] }
veytrane-web-management = { path = "apps/web-management", optional = true }
socket2 = "0.6.5"
rusqlite = { version = "=0.37.0", features = ["bundled"], optional = true }
sha2 = { version = "=0.10.9", optional = true }
zeroize = { version = "1.8", features = ["derive"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
if-addrs = "0.15.0"
mdns-sd = "0.21.3"
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = "0.11.12"
rand = "0.10.3"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
gpui = { version = "=0.2.2", optional = true }
dirs = { version = "=5.0.1", optional = true }
serde_json = "=1.0.151"
axum = { version = "=0.8.9", optional = true }
reqwest = { version = "=0.13.5", default-features = false, optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }

[build-dependencies]
embed-resource = "=3.0.11"

[dev-dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tower = { version = "=0.5.3", features = ["util"] }
veytrane-files = { path = "crates/veytrane-files", features = ["test-support"] }
veytrane-node = { path = "crates/veytrane-node", features = ["test-support"] }
veytrane-speed = { path = "crates/veytrane-speed", default-features = false, features = ["test-support"] }
veytrane-transport = { path = "crates/veytrane-transport", features = ["test-support", "signal-tls-server"] }

[[bin]]
name = "p2p-desktop"
path = "src/bin/p2p-desktop.rs"
required-features = ["desktop-client"]

[[bin]]
name = "p2p-agent"
path = "src/bin/p2p-agent.rs"
required-features = ["agent-base"]

[[bin]]
name = "p2p_file"
path = "src/main.rs"
required-features = ["standalone"]

[[bin]]
name = "p2p-node"
path = "src/bin/p2p-node.rs"
required-features = ["node-cli"]

[[bin]]
name = "sub2api-client"
path = "src/bin/sub2api-client.rs"
required-features = ["sub2api-client"]

[[bin]]
name = "p2p-sub2api-gateway"
path = "src/bin/p2p-sub2api-gateway.rs"
required-features = ["sub2api-gateway"]

[[example]]
name = "sub2api-client-harness"
path = "examples/sub2api-client-harness.rs"
required-features = ["sub2api-runtime"]

[[bin]]
name = "live-viewer"
path = "src/bin/live-viewer.rs"
required-features = ["live"]

[[bin]]
name = "live-gateway"
path = "src/bin/live-gateway.rs"
required-features = ["live"]

[[test]]
name = "ipv6_cli_send"
required-features = ["standalone"]

[[test]]
name = "issue3_chunk_size_before_alloc"
required-features = ["standalone"]

[[test]]
name = "signaling_tls_cli"
required-features = ["standalone"]

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.24.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.2", features = ["blocking"], optional = true }
x11rb = { version = "=0.13.2", optional = true }
