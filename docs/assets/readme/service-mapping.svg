<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
<title id="title">Veytrane service mapping</title><desc id="desc">Remote Ubuntu service 127.0.0.1:8080 is authorized by service ID sub2api and accessed through local Mac listener 127.0.0.1:18081. Data can flow in both directions.</desc>
<defs></defs><rect x="0" y="0" width="1440" height="460" rx="24" fill="#F4F7FC" stroke="none"/><text x="48" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#5C718D" text-anchor="start">REMOTE SERVICE. LOCAL ACCESS.</text><text x="48" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="650" fill="#162D4B" text-anchor="start">Publish once. Access through an authorized device.</text><rect x="48" y="151" width="432" height="232" rx="20" fill="#FFFFFF" stroke="#D8E2F0"/><rect x="70" y="172" width="388" height="36" rx="10" fill="#FFF3E8" stroke="none"/><text x="88" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#B8601C" text-anchor="start">REMOTE ENDPOINT</text><text x="76" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="29" font-weight="700" fill="#152B49" text-anchor="start">Ubuntu</text><text x="76" y="293" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="600" fill="#B8601C" text-anchor="start">127.0.0.1:8080</text><text x="76" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5C718D" text-anchor="start">Published service · sub2api</text><rect x="960" y="151" width="432" height="232" rx="20" fill="#FFFFFF" stroke="#D8E2F0"/><rect x="982" y="172" width="388" height="36" rx="10" fill="#EBF2FF" stroke="none"/><text x="1000" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#2458C0" text-anchor="start">LOCAL ENDPOINT</text><text x="988" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="29" font-weight="700" fill="#152B49" text-anchor="start">Mac</text><text x="988" y="293" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="600" fill="#2458C0" text-anchor="start">127.0.0.1:18081</text><text x="988" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5C718D" text-anchor="start">Local listener · browser / app</text><path d="M506 266 H934" fill="none" stroke="#94ABC9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M515 257 L506 266 L515 275 M925 257 L934 266 L925 275" fill="none" stroke="#94ABC9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="558" y="213" width="324" height="106" rx="19" fill="#102D43" stroke="none"/><text x="720" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#80DDC7" text-anchor="middle">AUTHORIZED CHANNEL</text><text x="720" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#F3FAFF" text-anchor="middle">QUIC / P2PN v2</text><text x="720" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5C718D" text-anchor="middle">Direct preferred · Relay optional</text><text x="48" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5C718D" text-anchor="start">Each loopback address belongs to its own device. Ports are illustrative.</text></svg>