<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">Veytrane Agent architecture</title><desc id="desc">Three management entry points share typed management APIs and local IPC. One Agent host coordinates a headless node core, private persistent state and shared networking infrastructure. Specialized products reuse core capabilities.</desc>
<defs></defs><rect x="0" y="0" width="1440" height="1100" rx="24" fill="#F4F7FC" stroke="none"/><text x="48" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#5C718D" text-anchor="start">ONE NODE. SHARED CONTROL.</text><text x="48" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="#152B49" text-anchor="start">One Agent owns the runtime.</text><text x="48" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#5C718D" text-anchor="start">Desktop, CLI and Web manage the same identity, connections and tasks.</text><rect x="48" y="181" width="432" height="116" rx="16" fill="#FFFFFF" stroke="#D8E2F0"/><text x="72" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="650" fill="#234F93" text-anchor="start">Native desktop</text><text x="72" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5C718D" text-anchor="start">GPUI workbench &amp; windows</text><text x="72" y="277" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="400" fill="#798EA9" text-anchor="start">desktop/agent_shell</text><path d="M264 298 V330" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 324 L264 330 L270 324" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="504" y="181" width="432" height="116" rx="16" fill="#FFFFFF" stroke="#D8E2F0"/><text x="528" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="650" fill="#234F93" text-anchor="start">Management CLI</text><text x="528" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5C718D" text-anchor="start">Commands &amp; JSON responses</text><text x="528" y="277" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="400" fill="#798EA9" text-anchor="start">node/adapters/cli</text><path d="M720 298 V330" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M714 324 L720 330 L726 324" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="960" y="181" width="432" height="116" rx="16" fill="#FFFFFF" stroke="#D8E2F0"/><text x="984" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="650" fill="#234F93" text-anchor="start">Local Web</text><text x="984" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5C718D" text-anchor="start">Loopback HTTP + admin token</text><text x="984" y="277" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="400" fill="#798EA9" text-anchor="start">node/adapters/web</text><path d="M1176 298 V330" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1170 324 L1176 330 L1182 324" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="335" width="1344" height="80" rx="16" fill="#E9F1FF" stroke="#CADBF9"/><text x="76" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#2458C0" text-anchor="start">MANAGEMENT CONTRACT + LOCAL IPC</text><text x="76" y="397" font-family="'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="400" fill="#314F75" text-anchor="start">node/api  +  node/local     ·     Unix socket / Windows named pipe</text><path d="M547 416 V448" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M541 442 L547 448 L553 442" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="453" width="960" height="114" rx="18" fill="#102D43" stroke="none"/><text x="76" y="493" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#80DDC7" text-anchor="start">AGENT HOST</text><text x="76" y="529" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="500" fill="#F3FAFF" text-anchor="start">Ownership · configuration commits · forward listeners · recovery</text><text x="981" y="493" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="400" fill="#B3CDD8" text-anchor="end">node/host</text><path d="M528 568 V600" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M522 594 L528 600 L534 594" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="605" width="960" height="190" rx="18" fill="#FFFFFF" stroke="#D8E2F0"/><text x="76" y="644" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#2458C0" text-anchor="start">HEADLESS NODE CORE</text><text x="981" y="644" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="400" fill="#798EA9" text-anchor="end">node/core</text><rect x="76" y="666" width="288" height="100" rx="12" fill="#F4F7FC" stroke="none"/><text x="92" y="701" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#152B49" text-anchor="start">Sessions &amp; authorization</text><text x="92" y="733" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5C718D" text-anchor="start">Identity · trust · service ACL</text><rect x="384" y="666" width="288" height="100" rx="12" fill="#F4F7FC" stroke="none"/><text x="400" y="701" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#152B49" text-anchor="start">Files &amp; tasks</text><text x="400" y="733" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5C718D" text-anchor="start">Queue · verify · resume</text><rect x="692" y="666" width="288" height="100" rx="12" fill="#F4F7FC" stroke="none"/><text x="708" y="701" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#152B49" text-anchor="start">Services &amp; diagnostics</text><text x="708" y="733" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5C718D" text-anchor="start">Service ID · speed · state</text><rect x="1040" y="453" width="352" height="342" rx="18" fill="#FFF5E9" stroke="#F0D8BB"/><text x="1065" y="493" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#A45B1E" text-anchor="start">PRIVATE NODE STATE</text><text x="1065" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#654528" text-anchor="start">Identity &amp; configuration</text><text x="1065" y="566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#94724E" text-anchor="start">Stable keys / node.json</text><text x="1065" y="613" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#654528" text-anchor="start">Tasks &amp; received files</text><text x="1065" y="641" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#94724E" text-anchor="start">Durable task state</text><text x="1065" y="688" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#654528" text-anchor="start">Ownership locks</text><text x="1065" y="716" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#94724E" text-anchor="start">One owner per identity</text><text x="1065" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#94724E" text-anchor="start">Stored outside the source tree</text><path d="M1010 510 H1037 M1010 700 H1037" fill="none" stroke="#BB9A71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M528 796 V828" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M522 822 L528 828 L534 822" fill="none" stroke="#9AB1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="833" width="1344" height="111" rx="18" fill="#E9F5F1" stroke="#CBE5DA"/><text x="76" y="873" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#27785D" text-anchor="start">SHARED INFRASTRUCTURE</text><text x="76" y="911" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="500" fill="#284E45" text-anchor="start">LAN / known IP · optional signaling / STUN · QUIC / TLS · Relay · Storage</text><rect x="48" y="973" width="1344" height="81" rx="16" fill="#FFFFFF" stroke="#D8E2F0"/><text x="76" y="1007" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#5C718D" text-anchor="start">SPECIALIZED PRODUCT COMPOSITION</text><text x="76" y="1035" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="