<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
<title id="title">Veytrane — Trusted devices. Connected.</title><desc id="desc">A brand illustration of two trusted devices connected by an encrypted direct channel, coordinated by a signaling server.</desc>
<defs><radialGradient id="halo"><stop stop-color="#163B50" stop-opacity=".7"/><stop offset="1" stop-color="#0B1426" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1440" height="540" rx="28" fill="#0B1426" stroke="none"/><circle cx="1160" cy="270" r="310" fill="url(#halo)"/><circle cx="1070" cy="270" r="194" stroke="#26384F" fill="none" stroke-dasharray="3 12"/><circle cx="1070" cy="270" r="122" stroke="#26384F" fill="none" stroke-dasharray="3 12"/><path d="M76 83 L99 124 L123 83" fill="none" stroke="#6DE3C2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M109 110 L125 138 L157 83" fill="none" stroke="#6697FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="86" font-weight="700" fill="#F1F6FF" text-anchor="start">Veytrane</text><text x="77" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#A9BDDA" text-anchor="start">Trusted devices. Connected.</text><text x="78" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="400" fill="#8FA5C5" text-anchor="start">Your devices. Your services. Your network.</text><rect x="78" y="395" width="135" height="39" rx="19" fill="#15253D" stroke="#2A3E59"/><text x="145.5" y="421" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#C3D5EE" text-anchor="middle">IDENTITY</text><rect x="228" y="395" width="124" height="39" rx="19" fill="#15253D" stroke="#2A3E59"/><text x="290.0" y="421" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#C3D5EE" text-anchor="middle">DIRECT</text><rect x="367" y="395" width="153" height="39" rx="19" fill="#15253D" stroke="#2A3E59"/><text x="443.5" y="421" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#C3D5EE" text-anchor="middle">CONTROL</text><path d="M1068 155 L935 302 M1068 155 L1215 302" fill="none" stroke="#7D91AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8"/><path d="M949 341 C1016 380 1138 380 1200 341" fill="none" stroke="#6DE3C2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1070" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#6DE3C2" text-anchor="middle">END-TO-END ENCRYPTED</text><rect x="975" y="90" width="190" height="74" rx="16" fill="#14243B" stroke="#30445F"/><text x="995" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#9CAECB" text-anchor="start">OPTIONAL SIGNAL</text><text x="995" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#A3B6D0" text-anchor="start">Cross-network pairing</text><rect x="838" y="283" width="212" height="92" rx="16" fill="#14243B" stroke="#30445F"/><text x="858" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#F7A866" text-anchor="start">DEVICE A</text><text x="858" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#A3B6D0" text-anchor="start">Trusted identity</text><rect x="1112" y="283" width="212" height="92" rx="16" fill="#14243B" stroke="#30445F"/><text x="1132" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#70A5FF" text-anchor="start">DEVICE B</text><text x="1132" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#A3B6D0" text-anchor="start">Trusted identity</text><text x="1370" y="501" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#7187A6" text-anchor="end">VEYTRANE / DEVICE CONNECTIVITY</text></svg>