nt-size:13px;color:#344c69;margin-bottom:3px}.hint p{margin:0}.foot{display:flex;justify-content:space-between;gap:14px;font-size:11px;color:#8591a2;margin-top:23px;padding-bottom:12px}.empty{grid-column:1/-1;text-align:center;padding:45px;color:var(--muted)}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#23374e;color:white;border-radius:9px;padding:10px 20px;box-shadow:0 5px 25px #1e304522;max-width:90vw;font-size:13px}.toast[hidden]{display:none}@media(min-width:1000px){.card:last-child:nth-child(odd){grid-column:1/2}}@media(max-width:680px){main{padding:30px 18px}.top-inner{padding:18px}.private{font-size:10px}h1{font-size:31px}.overview{gap:23px}.toolbar{align-items:stretch;flex-direction:column;gap:14px}.search{width:100%}.grid{grid-template-columns:1fr}.card{padding:21px}.foot{flex-direction:column;gap:4px}.hint{padding:16px}.metric b{font-size:22px}}

<div class="toolbar"><nav class="tabs" aria-label="按服务类型筛选"><button class="tab" data-filter="全部" aria-pressed="true">全部服务</button><button class="tab" data-filter="应用" aria-pressed="false">应用</button><button class="tab" data-filter="管理" aria-pressed="false">管理</button><button class="tab" data-filter="文件" aria-pressed="false">文件共享</button></nav><input class="search" id="search" type="search" placeholder="搜索服务或端口…" aria-label="搜索服务或端口"></div>

<aside class="hint"><span aria-hidden="true">ⓘ</span><div><strong>后台连接，按需访问</strong><p>Mac 登录后由后台服务启动映射，无需手动打开 P2P 软件。管理页面需使用对应节点的令牌登录；Samba 请在 Finder 中连接。</p><p style="margin-top:6px">标签表示保存的配置，不代表实时连通性。更新映射后同步此页面，刷新即可看到最新入口。</p></div></aside>
<footer class="foot"><span id="updated"></span><span>Mac 本地入口 → Ubuntu 服务 · 无外部资源</span></footer>
</main>

<script>
const data=JSON.parse(document.getElementById('navigation-data').textContent);
const icons={管理:'<rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 9h18M8 9v10m3 3h2"/>',应用:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',文件:'<path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9H3z"/>'};
let filter='全部',timer;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,2600)}
async function copy(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const t=el('textarea');t.value=text;t.style.cssText='position:fixed;top:-9999px';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('clipboard')}notify('地址已复制')}catch{notify('复制失败，请手动选择并复制上方地址')}}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const grid=document.getElementById('services');grid.replaceChildren();const list=data.services.filter(s=>(filter==='全部'||s.category===filter)&&[s.title,s.name,s.listen,s.target,s.url].join(' ').toLowerCase().includes(q));for(const s of list){const card=el('article','card');const top=el('div','card-top');const icon=el('div','icon');icon.setAttribute('aria-hidden','true');icon.innerHTML='<svg viewBox="0 0 24 24">'+(icons[s.category]||icons.应用)+'</svg>';let state=s.remote?(s.enabled?(s.autoStart?'已启用 · 自动启动':'已启用 · 手动启动'):'已停用'):'本机管理';top.append(icon,el('span','pill'+(s.enabled?'':' off'),state));card.append(top,el('h2','',s.title),el('p','description',s.description));const endpoint=el('div','endpoint');endpoint.append(el('code','',s.url),el('span','protocol',s.protocol.toUpperCase()));card.append(endpoint,el('div','route',s.remote?'Ubuntu 目标  →  '+s.target:s.target));const actions=el('div','actions');if(['http','https'].includes(s.protocol)&&s.enabled){const a=el('a','primary','打开页面 ↗');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','打开'+s.title);actions.append(a)}else{const b=el('button','primary',s.protocol==='smb'?'复制 Finder 连接地址':'复制连接地址');b.onclick=()=>copy(s.url);actions.append(b)}const c=el('button','copy','复制地址');c.setAttribute('aria-label','复制'+s.name+'地址');c.onclick=()=>copy(s.url);if(['http','https'].includes(s.protocol))actions.append(c);card.append(actions);grid.append(card)}if(!list.length)grid.append(el('p','empty','没有匹配的服务，试试其他名称或端口。'))}
document.getElementById('total').textContent=data.services.length;
document.getElementById('mapped').textContent=data.services.filter(s=>s.remote).length;
document.getElementById('automatic').textContent=data.services.filter(s=>s.remote&&s.enabled&&s.autoStart).length;
document.getElementById('updated').textContent='配置更新于 '+new Date(data.updatedAt).toLocaleString('zh-CN',{hour12:false});
document.getElementById('search').addEventListener('input',render);
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));render()}));render();
</script>
