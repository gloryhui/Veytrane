[package]
name = "veytrane-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
legacy-control = []
private-storage = ["dep:rustix", "dep:windows-sys"]
quic = ["dep:quinn", "dep:rcgen", "dep:socket2", "dep:tracing", "tokio/macros", "tokio/net", "tokio/sync", "tokio/time"]
signal-tls = ["quic", "dep:tokio-rustls", "dep:webpki-roots", "dep:zeroize", "tokio/rt"]
signal-tls-server = ["signal-tls"]
test-support = []

[dependencies]
blake3 = "1.8.7"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = { version = "0.11.12", optional = true }
rand = "0.10.3"
rcgen = { version = "0.14.10", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
socket2 = { version = "0.6.5", optional = true }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
tracing = { version = "0.1.44", optional = true }
webpki-roots = { version = "=1.0.9", optional = true }
zeroize = { version = "1.8", features = ["derive"], optional = true }

[target."cfg(unix)".dependencies]
rustix = { version = "=1.1.5", features = ["process"], optional = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Threading"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util"] }
