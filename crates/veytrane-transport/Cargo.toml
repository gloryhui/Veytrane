[package]
name = "veytrane-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
blake3 = "1.8.7"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
