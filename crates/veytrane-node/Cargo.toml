[package]
name = "veytrane-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = "0.11.12"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "sync", "time"] }
veytrane-transport = { path = "../veytrane-transport" }
