[package]
name = "veytrane-speed"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
default = ["node-runtime"]
node-runtime = ["dep:postcard", "dep:quinn", "dep:rand", "dep:serde", "dep:tracing", "dep:veytrane-node", "tokio/macros", "tokio/sync"]
test-support = []

[dependencies]
postcard = { version = "1.1.3", features = ["alloc"], optional = true }
quinn = { version = "0.11.12", optional = true }
rand = { version = "0.10.3", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
tokio = { version = "1.53.1", features = ["io-util", "rt", "time"] }
tracing = { version = "0.1.44", optional = true }
veytrane-node = { path = "../veytrane-node", optional = true }
veytrane-transport = { path = "../veytrane-transport" }
