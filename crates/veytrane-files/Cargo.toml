[package]
name = "veytrane-files"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
node-runtime = ["node-tasks", "safe-storage", "dep:quinn", "tokio/macros", "tokio/rt"]
node-tasks = ["dep:thiserror", "dep:tokio", "dep:veytrane-file-policy", "dep:veytrane-node"]
safe-storage = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:rand",
    "dep:rustix",
    "dep:serde_json",
    "dep:unicode-normalization",
    "dep:windows-sys",
    "veytrane-transport/private-storage",
]
test-support = ["dep:rand", "dep:thiserror"]

[dependencies]
blake3 = "1.8.7"
cap-fs-ext = { version = "=3.4.6", optional = true }
cap-std = { version = "=3.4.6", optional = true }
hex = "0.4.3"
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = { version = "0.11.12", optional = true }
rand = { version = "0.10.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", optional = true }
thiserror = { version = "2.0.20", optional = true }
tokio = { version = "1.53.1", features = ["io-util", "sync", "time"], optional = true }
tracing = "0.1.44"
unicode-normalization = { version = "=0.1.25", optional = true }
veytrane-file-policy = { path = "../veytrane-file-policy", optional = true }
veytrane-node = { path = "../veytrane-node", optional = true }
veytrane-transport = { path = "../veytrane-transport" }

[dev-dependencies]
serde_json = "=1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }
veytrane-node = { path = "../veytrane-node", features = ["test-support"] }
veytrane-speed = { path = "../veytrane-speed", features = ["test-support"] }
veytrane-transport = { path = "../veytrane-transport", features = ["quic"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"], optional = true }
