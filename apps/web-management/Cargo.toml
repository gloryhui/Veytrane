[package]
name = "veytrane-web-management"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
axum = "=0.8.9"
dirs = "=5.0.1"
hex = "0.4.3"
rand = "0.10.3"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
veytrane-http-auth = { path = "../../crates/veytrane-http-auth" }
veytrane-management = { path = "../../crates/veytrane-management" }
veytrane-transport = { path = "../../crates/veytrane-transport", features = ["private-storage"] }
zeroize = "1.8"

[target."cfg(unix)".dependencies]
rustix = { version = "=1.1.5", features = ["process"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "test-util"] }
tower = { version = "=0.5.3", features = ["util"] }
